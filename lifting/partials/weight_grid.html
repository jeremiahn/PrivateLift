<!-- lifting/partials/weight_grid.html -->
<div id="weight-cards-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
    {% for exercise, weight in weights.items %}
        <div class="flex flex-col items-start w-full">
            <!-- Exercise Label Left-Aligned Above Card -->
            <span class="text-[9px] md:text-[11px] font-black uppercase tracking-widest mb-1.5 ml-0.5 sm:ml-1
                {% if 'SQUAT' in exercise|upper %}text-red-500
                {% elif 'BENCH' in exercise|upper %}text-blue-500
                {% elif 'DEAD' in exercise|upper %}text-green-500
                {% else %}text-gray-400{% endif %}">
                {{ exercise }}
            </span>
            
            <!-- Card Container with Left-Aligned Weight -->
            <div class="w-full bg-gray-900 py-3 px-3 md:p-5 rounded-xl border border-t-4 
                {% if 'SQUAT' in exercise|upper %}border-red-500 dark:border-red-500
                {% elif 'BENCH' in exercise|upper %}border-blue-500 dark:border-blue-500
                {% elif 'DEAD' in exercise|upper %}border-green-500 dark:border-green-500
                {% else %}border-gray-500 dark:border-gray-500{% endif %}
                flex flex-col items-start justify-center">
                
                <div class="flex items-baseline gap-0.5 md:gap-1">
                    <span class="text-sm sm:text-2xl md:text-3xl font-black text-white leading-none">{{ weight }}</span>
                    <span class="text-[8px] md:text-xs text-gray-600 font-bold uppercase ml-0.5 md:ml-1">lbs</span>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
