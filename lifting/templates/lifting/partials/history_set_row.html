<div id="set-{{ set.id }}" class="flex justify-between items-center bg-gray-50 dark:bg-gray-900 p-3 md:p-4 rounded-lg border border-gray-200 dark:border-gray-800 transition">
    <div class="flex flex-col">
        <span class="text-gray-800 dark:text-gray-300 font-bold text-base md:text-lg leading-tight">{{ set.exercise }}</span>
        <span class="text-gray-500 dark:text-gray-400 text-xs md:text-sm font-normal">{{ set.weight }} lbs x {{ set.reps }} reps</span>
    </div>

    <div class="flex items-center gap-2 md:gap-4 text-right">
        <div class="mr-1 md:mr-2">
            <select hx-post="{% url 'update_set_type' set.id %}?page=history"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-target="#set-{{ set.id }}"
                    hx-swap="outerHTML"
                    name="set_type"
                    class="px-1.5 py-0.5 md:px-2 md:py-1 text-[8px] md:text-[10px] font-bold uppercase rounded border cursor-pointer focus:outline-none transition
                        {% if set.set_type == 'warmup' %}bg-gray-100 text-gray-700 border-gray-300 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600
                        {% elif set.set_type == 'failure' %}bg-red-50 text-red-700 border-red-200 hover:bg-red-100 dark:bg-red-900/30 dark:text-red-300 dark:border-red-800 dark:hover:bg-red-900/50
                        {% else %}bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100 dark:bg-blue-900/20 dark:text-blue-300 dark:border-blue-900/50 dark:hover:bg-blue-900/40{% endif %}">
                <option class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white" value="working" {% if set.set_type == 'working' or not set.set_type %}selected{% endif %}>Working</option>
                <option class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white" value="warmup" {% if set.set_type == 'warmup' %}selected{% endif %}>Warm Up</option>
                <option class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white" value="failure" {% if set.set_type == 'failure' %}selected{% endif %}>Failed</option>
            </select>
        </div>

        <div class="flex flex-col items-end justify-center">
            <span class="block text-blue-600 dark:text-blue-400 text-[9px] md:text-xs font-semibold tracking-wide leading-none mb-1">
                e1RM: {{ set.e1rm }}{% if set.rpe %}<span class="text-purple-600 dark:text-purple-400 ml-1 font-bold text-[8px] md:text-[10px] bg-purple-50 dark:bg-purple-950/40 px-1 py-0.5 rounded border border-purple-200 dark:border-purple-900/30">@{{ set.rpe|floatformat:"-1" }}</span>{% endif %}
            </span>
            <span class="block text-green-500 font-bold text-xs">✓ Logged</span>
        </div>

        <form class="inline m-0 p-0">
            {% csrf_token %}
            <button type="button"
                    hx-post="{% url 'delete_set' set.id %}"
                    hx-include="closest form"
                    hx-target="#set-{{ set.id }}"
                    hx-swap="outerHTML"
                    hx-confirm="Are you sure you want to delete this set? This cannot be undone."
                    class="text-red-900 hover:text-red-500 text-xl font-black p-1.5 md:p-2 transition duration-200" 
                    title="Delete Set">
                &times;
            </button>
        </form>
    </div>
</div>
